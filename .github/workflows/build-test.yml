name: build-test
on: [push, pull_request]

jobs:
  amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t nidar-dev -f docker/dev/Dockerfile .
      - run: ./scripts/configure.sh && ./scripts/build.sh && ./scripts/test.sh
      - run: tests/integration/test_mavsdk_dependency.sh
      - run: tests/integration/test_mavsdk_boundary.sh
      - run: tests/integration/test_nidar_flight_cli.sh
      - run: ./scripts/lint.sh
      - run: ./scripts/sanitize.sh

  sitl:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/amd64 -t nidar-dev -f docker/dev/Dockerfile .
      - run: ./scripts/configure.sh && ./scripts/build.sh
      - run: docker build --progress=plain -t nidar-px4-sim:v1.17.0-x500 -f docker/sim/Dockerfile .
      - run: tests/sitl/test_sitl_smoke.sh
      - run: NIDAR_SITL_TIMEOUT_SECONDS=90 scripts/sitl-headless.sh
      - run: tests/sitl/test_vehicle_sitl.sh --occupied-port
      - run: NIDAR_SITL_TIMEOUT_SECONDS=90 scripts/sitl-vehicle.sh

# linux/arm64 runtime packaging is intentionally deferred to Phase 4.
# MAVSDK v3.17.2 publishes no Ubuntu 24.04 arm64 development package, so
# Phase 3A does not substitute an unverified Debian artifact or source build.
